name: gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    environment: dev
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      ERP_SERVER_ID: ${{ vars.ERP_SERVER_ID }}
      VENDOR_SERVER_ID: ${{ vars.VENDOR_SERVER_ID }}
      A2A_PAYMENTS_AGENT_URL: ${{ vars.A2A_PAYMENTS_AGENT_URL }}
      LOCAL_MCP_ERP_URL: http://127.0.0.1:18080/mcp
      LOCAL_MCP_VENDOR_URL: http://127.0.0.1:18081/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/unit tests/gates payments_agent/tests -q
      - run: PYTHONPATH=mcp_servers uv run pytest mcp_servers/tests -q
